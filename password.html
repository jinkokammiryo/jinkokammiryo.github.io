<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>パスワード生成</title>
<style>
  :root {
    --bg: #f3f5f7;
    --surface: #ffffff;
    --text: #14202b;
    --muted: #5d6b78;
    --accent: #0a5cff;
    --line: #d5dce3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1419;
      --surface: #182028;
      --text: #e8eef4;
      --muted: #93a1ae;
      --accent: #5b9bff;
      --line: #2b3641;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    display: grid;
    place-items: center;
    padding: 20px;
  }
  main {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 28px 24px;
    text-align: center;
  }
  h1 { font-size: 1rem; font-weight: 600; margin: 0 0 20px; color: var(--muted); }
  #pw {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: clamp(2rem, 11vw, 2.8rem);
    letter-spacing: 0.12em;
    font-weight: 700;
    padding: 18px 8px;
    border: 1px dashed var(--line);
    border-radius: 8px;
    margin: 0 0 20px;
    user-select: all;
    word-break: break-all;
  }
  .row { display: flex; gap: 10px; }
  button {
    flex: 1;
    font: inherit;
    font-weight: 600;
    padding: 14px;
    border-radius: 8px;
    border: 1px solid var(--accent);
    cursor: pointer;
  }
  #regen { background: var(--accent); color: #fff; }
  #copy { background: transparent; color: var(--accent); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #msg { min-height: 1.4em; margin: 14px 0 0; font-size: .9rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>8桁パスワード（英大文字・英小文字・数字／紛らわしい文字を除く）</h1>
  <div id="pw" aria-live="polite"></div>
  <div class="row">
    <button id="regen" type="button">再生成</button>
    <button id="copy" type="button">コピー</button>
  </div>
  <p id="msg"></p>
</main>
<script>
  // 紛らわしい文字（I, O, l, 0, 1）は除外
  const UPPER = "ABCDEFGHJKLMNPQRSTUVWXYZ";
  const LOWER = "abcdefghijkmnopqrstuvwxyz";
  const DIGITS = "23456789";
  const ALL = UPPER + LOWER + DIGITS;
  const LEN = 8;

  // 暗号論的乱数（偏りなし）
  function randInt(max) {
    const limit = Math.floor(0x100000000 / max) * max;
    const buf = new Uint32Array(1);
    do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
    return buf[0] % max;
  }
  function pick(set) { return set[randInt(set.length)]; }

  function generate() {
    // 大文字・小文字・数字を最低1文字ずつ含める
    const chars = [pick(UPPER), pick(LOWER), pick(DIGITS)];
    while (chars.length < LEN) chars.push(pick(ALL));
    for (let i = chars.length - 1; i > 0; i--) {
      const j = randInt(i + 1);
      [chars[i], chars[j]] = [chars[j], chars[i]];
    }
    return chars.join("");
  }

  const pwEl = document.getElementById("pw");
  const msgEl = document.getElementById("msg");

  function render() {
    pwEl.textContent = generate();
    msgEl.textContent = "";
  }

  document.getElementById("regen").addEventListener("click", render);
  document.getElementById("copy").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(pwEl.textContent);
      msgEl.textContent = "コピーしました";
    } catch (e) {
      msgEl.textContent = "コピーできませんでした。文字をタップして選択してください";
    }
  });

  render(); // ページを開いたときに自動生成
</script>
</body>
</html>
